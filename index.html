<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi STIs Test Kit</title>
    <!-- Google Font: Itim -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Itim', cursive; background-color: #f8fafc; }
    </style>
</head>
<body class="h-screen flex flex-col md:flex-row overflow-hidden">

    <!-- 👥 Sidebar ซ้าย: รายชื่อคนไข้ -->
    <aside class="w-full md:w-80 bg-white border-r border-slate-200 flex flex-col h-1/3 md:h-full z-10 shadow-sm">
        <div class="p-4 border-b border-slate-100 bg-sky-50/50 flex justify-between items-center">
            <div>
                <h1 class="text-lg font-bold text-sky-950">ระบบเจ้าหน้าที่/หมอ</h1>
                <p class="text-xs text-sky-600">แชท</p>
            </div>
            <button onclick="loadPatientList()" class="text-xs bg-white text-sky-600 px-2.5 py-1 rounded-lg border border-sky-200 hover:bg-sky-50 cursor-pointer shadow-xs">
                🔄 รีเฟรช
            </button>
        </div>

        <!-- List รายชื่อ -->
        <div id="patientList" class="flex-1 overflow-y-auto divide-y divide-slate-100">
            <p class="text-xs text-slate-400 text-center py-6">กำลังโหลดรายชื่อคนไข้...</p>
        </div>
    </aside>

    <!-- 💬 Main ขวา: ห้องแชตตอบคำถาม -->
    <main class="flex-1 bg-sky-50/30 flex flex-col h-2/3 md:h-full">
        
        <!-- Header แสดงรายละเอียดคนไข้ที่เลือก -->
        <header id="chatHeader" class="p-4 bg-white border-b border-slate-200 shadow-xs flex justify-between items-center min-h-[65px]">
            <div>
                <h2 id="headerName" class="font-bold text-slate-800 text-base">กรุณาเลือกเคสคนไข้ทางด้านซ้าย</h2>
                <div id="headerDetails" class="text-xs text-slate-500 mt-0.5 flex gap-3">
                    <span>เพศ: -</span>
                    <span>อายุ: -</span>
                    <span>ผลตรวจ: -</span>
                </div>
            </div>
        </header>

        <!-- กล่องข้อความแชต -->
        <div id="chatMessages" class="flex-1 p-4 overflow-y-auto space-y-3">
            <div class="text-center text-xs text-slate-400 mt-10">กรุณาเลือกคนไข้จากรายการซ้ายมือ เพื่อเริ่มการสนทนา</div>
        </div>

        <!-- ฟอร์มส่งข้อความฝั่งหมอ -->
        <form id="doctorChatForm" class="p-3 bg-white border-t border-slate-200 flex gap-2">
            <input type="text" id="doctorInput" placeholder="พิมพ์ข้อความตอบกลับคนไข้..." disabled required
                   class="flex-1 p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-sky-400 disabled:bg-slate-100 disabled:cursor-not-allowed">
            <button type="submit" id="doctorSendBtn" disabled class="bg-sky-500 hover:bg-sky-600 disabled:bg-slate-300 text-white px-6 rounded-xl text-sm font-medium transition cursor-pointer">
                ส่งข้อความ
            </button>
        </form>

    </main>

    <script>
        const SUPABASE_URL = "https://gsfwxrbeykupnobvnvvj.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_qpHFtNjXGKYTIXMXaT_NPw_BLIOv7oc";
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let activePatientId = null;
        let activeChatHistory = [];
        let activePatientData = null;

        document.addEventListener('DOMContentLoaded', () => {
            loadPatientList();
            
            // Auto refresh รายชื่อและแชตทุกๆ 5 วินาที
            setInterval(() => {
                loadPatientList(true);
                if (activePatientId) {
                    loadChatMessages(activePatientId, true);
                }
            }, 5000);
        });

        // 📋 โหลดรายการคนไข้ทั้งหมด
        async function loadPatientList(isSilent = false) {
            const listContainer = document.getElementById('patientList');
            if (!isSilent && listContainer.children.length <= 1) {
                listContainer.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">กำลังโหลดรายชื่อคนไข้...</p>`;
            }

            // ดึงข้อมูลการปรึกษา
            const { data: consultations, error } = await db
                .from('consultations')
                .select('*')
                .order('updated_at', { ascending: false });

            if (error || !consultations || consultations.length === 0) {
                listContainer.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">ยังไม่มีเคสเข้าปรึกษา</p>`;
                return;
            }

            // ดึงข้อมูลโปรไฟล์ผู้ป่วยเพิ่มเติม (อายุ, ผลตรวจ)
            const patientIds = consultations.map(c => c.id);
            const { data: records } = await db
                .from('patient_records')
                .select('id, age, test_result, symptoms, sex')
                .in('id', patientIds);

            const recordMap = {};
            if (records) {
                records.forEach(r => recordMap[r.id] = r);
            }

            listContainer.innerHTML = consultations.map(c => {
                const profile = recordMap[c.id] || {};
                const isSelected = c.id === activePatientId;
                const activeClass = isSelected ? 'bg-sky-50 border-l-4 border-sky-500' : 'hover:bg-slate-50';
                
                const lastMsg = c.chat_history && c.chat_history.length > 0 
                    ? c.chat_history[c.chat_history.length - 1].message 
                    : 'ยังไม่มีข้อความ';

                const ageText = profile.age ? `${profile.age} ปี` : 'ไม่ระบุอายุ';
                const sexText = c.sex || profile.sex || 'ไม่ระบุเพศ';
                const resultBadge = profile.test_result === 'positive' 
                    ? `<span class="bg-red-100 text-red-600 px-1.5 py-0.5 rounded text-[10px] font-bold">บวก</span>` 
                    : `<span class="bg-emerald-100 text-emerald-600 px-1.5 py-0.5 rounded text-[10px] font-bold">ลบ</span>`;

                return `
                    <div onclick="selectPatient('${c.id}', '${c.name || 'ผู้ป่วยทั่วไป'}', '${sexText}', '${ageText}', '${profile.test_result || '-'}')" 
                         class="p-3.5 cursor-pointer transition ${activeClass}">
                        <div class="flex justify-between items-start mb-1">
                            <h3 class="font-bold text-slate-800 text-sm">${c.name || 'ผู้ป่วยทั่วไป'}</h3>
                            ${resultBadge}
                        </div>
                        <div class="text-[11px] text-slate-500 flex gap-2 mb-1.5">
                            <span>เพศ: ${sexText}</span>
                            <span>•</span>
                            <span>อายุ: ${ageText}</span>
                        </div>
                        <p class="text-xs text-slate-400 truncate">${lastMsg}</p>
                    </div>
                `;
            }).join('');
        }

        // 👆 เลือกคนไข้เพื่อเปิดแชต
        async function selectPatient(id, name, sex, age, result) {
            activePatientId = id;
            activePatientData = { name, sex, age, result };

            // อัปเดต Header ด้านบน
            document.getElementById('headerName').innerText = `คุณ ${name}`;
            document.getElementById('headerDetails').innerHTML = `
                <span><b>เพศ:</b> ${sex}</span>
                <span><b>อายุ:</b> ${age}</span>
                <span><b>ผลตรวจ:</b> ${result.toUpperCase()}</span>
            `;

            // เปิดใช้งานช่องพิมพ์แชต
            document.getElementById('doctorInput').disabled = false;
            document.getElementById('doctorSendBtn').disabled = false;

            // โหลดประวัติแชต
            await loadChatMessages(id);
            loadPatientList(true); // อัปเดตสีแถบเลือก
        }

        // 💬 ดึงประวัติแชตของคนไข้ที่เลือก
        async function loadChatMessages(id, isSilent = false) {
            const chatContainer = document.getElementById('chatMessages');

            const { data } = await db
                .from('consultations')
                .select('chat_history')
                .eq('id', id)
                .maybeSingle();

            if (data && data.chat_history) {
                activeChatHistory = data.chat_history;
                renderDoctorChatUI();
            }
        }

        // แสดงผลรายการแชต
        function renderDoctorChatUI() {
            const chatContainer = document.getElementById('chatMessages');
            chatContainer.innerHTML = '';

            activeChatHistory.forEach(msg => {
                if (msg.sender === 'patient') {
                    // ข้อความคนไข้ (แสดงฝั่งซ้าย)
                    chatContainer.innerHTML += `
                        <div class="flex items-start gap-2">
                            <div class="w-8 h-8 rounded-full bg-slate-300 text-slate-700 flex items-center justify-center text-xs font-bold shrink-0">คนไข้</div>
                            <div class="bg-white text-slate-800 p-3 rounded-2xl rounded-tl-none text-sm max-w-[80%] border border-slate-200 shadow-xs">
                                ${msg.message}
                            </div>
                        </div>
                    `;
                } else {
                    // ข้อความหมอ (แสดงฝั่งขวา)
                    chatContainer.innerHTML += `
                        <div class="flex items-start justify-end gap-2">
                            <div class="bg-sky-500 text-white p-3 rounded-2xl rounded-tr-none text-sm max-w-[80%] shadow-xs">
                                ${msg.message}
                            </div>
                        </div>
                    `;
                }
            });

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // 📤 หมอส่งข้อความตอบกลับ
        document.getElementById('doctorChatForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!activePatientId) return;

            const input = document.getElementById('doctorInput');
            const messageText = input.value.trim();
            if (!messageText) return;

            input.value = '';

            // บันทึกข้อความหมอ (sender: 'doctor')
            activeChatHistory.push({ sender: 'doctor', message: messageText });
            renderDoctorChatUI();

            const { error } = await db
                .from('consultations')
                .upsert([{
                    id: activePatientId,
                    chat_history: activeChatHistory,
                    updated_at: new Date().toISOString()
                }], { onConflict: 'id' });

            if (error) {
                console.error('Doctor send error:', error.message);
                alert('ส่งข้อความไม่สำเร็จ: ' + error.message);
            } else {
                loadPatientList(true); // อัปเดตรายการข้อความล่าสุดใน sidebar
            }
        });
    </script>
</body>
</html>
